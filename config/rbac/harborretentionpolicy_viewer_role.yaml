# This rule is not used by the project harbor-resource-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to harbor.oreonit.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: harbor-resource-operator
    app.kubernetes.io/managed-by: kustomize
  name: harborretentionpolicy-viewer-role
rules:
- apiGroups:
  - harbor.oreonit.com
  resources:
  - harborretentionpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - harbor.oreonit.com
  resources:
  - harborretentionpolicies/status
  verbs:
  - get
