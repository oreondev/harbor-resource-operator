apiVersion: v1
kind: Secret
metadata:
  name: edge-eu-west-creds
  namespace: platform
type: Opaque
stringData:
  accessKey: robot$replication
  accessSecret: change-me
---
apiVersion: harbor.oreonit.com/v1alpha1
kind: HarborRegistry
metadata:
  name: edge-eu-west
  namespace: platform
spec:
  connectionRef:
    name: prod-harbor
    namespace: harbor-system
  type: harbor
  url: https://harbor.eu-west.example.com
  credentialsSecretRef:
    name: edge-eu-west-creds
  description: Edge site EU West
