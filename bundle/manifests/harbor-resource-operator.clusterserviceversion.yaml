apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "harbor.oreonit.com/v1alpha1",
          "kind": "HarborConnection",
          "metadata": {
            "name": "prod-harbor",
            "namespace": "harbor-system"
          },
          "spec": {
            "allowedNamespaces": [
              "*"
            ],
            "credentialsSecretRef": {
              "name": "prod-harbor-admin"
            },
            "syncPeriod": "10m",
            "url": "https://harbor.example.com"
          }
        },
        {
          "apiVersion": "harbor.oreonit.com/v1alpha1",
          "kind": "HarborGarbageCollection",
          "metadata": {
            "name": "harbor-gc",
            "namespace": "harbor-system"
          },
          "spec": {
            "connectionRef": {
              "name": "prod-harbor",
              "namespace": "harbor-system"
            },
            "deleteUntagged": true,
            "deletionPolicy": "Retain",
            "schedule": "0 0 4 * * 0",
            "workers": 2
          }
        },
        {
          "apiVersion": "harbor.oreonit.com/v1alpha1",
          "kind": "HarborImmutableRule",
          "metadata": {
            "name": "release-tags",
            "namespace": "team-payments"
          },
          "spec": {
            "connectionRef": {
              "name": "prod-harbor",
              "namespace": "harbor-system"
            },
            "projectRef": {
              "name": "team-payments"
            },
            "repositories": {
              "pattern": "**"
            },
            "tags": {
              "decoration": "matches",
              "pattern": "v*.*.*"
            }
          }
        },
        {
          "apiVersion": "harbor.oreonit.com/v1alpha1",
          "kind": "HarborLabel",
          "metadata": {
            "name": "release-candidate",
            "namespace": "team-payments"
          },
          "spec": {
            "color": "#2E7D32",
            "connectionRef": {
              "name": "prod-harbor",
              "namespace": "harbor-system"
            },
            "description": "Artifacts promoted to staging",
            "name": "release-candidate",
            "projectRef": {
              "name": "team-payments"
            },
            "scope": "project"
          }
        },
        {
          "apiVersion": "harbor.oreonit.com/v1alpha1",
          "kind": "HarborProject",
          "metadata": {
            "name": "team-payments",
            "namespace": "team-payments"
          },
          "spec": {
            "connectionRef": {
              "name": "prod-harbor",
              "namespace": "harbor-system"
            },
            "deletionPolicy": "Retain",
            "metadata": {
              "autoScan": true,
              "preventVulnerable": true,
              "reuseSystemCVEAllowlist": true,
              "severity": "critical"
            },
            "name": "payments",
            "public": false,
            "storageQuotaBytes": 53687091200
          }
        },
        {
          "apiVersion": "harbor.oreonit.com/v1alpha1",
          "kind": "HarborProjectMember",
          "metadata": {
            "name": "payments-developers",
            "namespace": "team-payments"
          },
          "spec": {
            "connectionRef": {
              "name": "prod-harbor",
              "namespace": "harbor-system"
            },
            "group": {
              "name": "payments-developers",
              "type": "oidc"
            },
            "projectRef": {
              "name": "team-payments"
            },
            "role": "developer"
          }
        },
        {
          "apiVersion": "harbor.oreonit.com/v1alpha1",
          "kind": "HarborRegistry",
          "metadata": {
            "name": "edge-eu-west",
            "namespace": "platform"
          },
          "spec": {
            "connectionRef": {
              "name": "prod-harbor",
              "namespace": "harbor-system"
            },
            "credentialsSecretRef": {
              "name": "edge-eu-west-creds"
            },
            "description": "Edge site EU West",
            "type": "harbor",
            "url": "https://harbor.eu-west.example.com"
          }
        },
        {
          "apiVersion": "harbor.oreonit.com/v1alpha1",
          "kind": "HarborReplicationPolicy",
          "metadata": {
            "name": "releases-to-edge",
            "namespace": "platform"
          },
          "spec": {
            "connectionRef": {
              "name": "prod-harbor",
              "namespace": "harbor-system"
            },
            "destNamespace": "payments",
            "destRegistryRef": {
              "name": "edge-eu-west"
            },
            "direction": "push",
            "filters": [
              {
                "type": "name",
                "value": "payments/**"
              },
              {
                "decoration": "matches",
                "type": "tag",
                "value": "v*"
              }
            ],
            "override": true,
            "singleActiveReplication": true,
            "trigger": {
              "cron": "0 0 2 * * *",
              "type": "scheduled"
            }
          }
        },
        {
          "apiVersion": "harbor.oreonit.com/v1alpha1",
          "kind": "HarborRetentionPolicy",
          "metadata": {
            "name": "payments-retention",
            "namespace": "team-payments"
          },
          "spec": {
            "connectionRef": {
              "name": "prod-harbor",
              "namespace": "harbor-system"
            },
            "projectRef": {
              "name": "team-payments"
            },
            "rules": [
              {
                "count": 10,
                "repositories": {
                  "pattern": "**"
                },
                "tags": {
                  "pattern": "**",
                  "untagged": false
                },
                "template": "latestPushedK"
              },
              {
                "tags": {
                  "pattern": "v*.*.*"
                },
                "template": "always"
              }
            ],
            "schedule": "0 0 3 * * *"
          }
        },
        {
          "apiVersion": "harbor.oreonit.com/v1alpha1",
          "kind": "HarborRobotAccount",
          "metadata": {
            "name": "payments-ci",
            "namespace": "team-payments"
          },
          "spec": {
            "connectionRef": {
              "name": "prod-harbor",
              "namespace": "harbor-system"
            },
            "description": "CI pipeline push",
            "duration": 90,
            "level": "project",
            "name": "ci",
            "permissions": [
              {
                "access": [
                  {
                    "action": "push",
                    "resource": "repository"
                  },
                  {
                    "action": "pull",
                    "resource": "repository"
                  },
                  {
                    "action": "read",
                    "resource": "artifact"
                  }
                ]
              }
            ],
            "projectRef": {
              "name": "team-payments"
            },
            "rotation": {
              "beforeExpiry": "168h"
            },
            "secret": {
              "name": "payments-ci-regcred",
              "type": "kubernetes.io/dockerconfigjson"
            }
          }
        },
        {
          "apiVersion": "harbor.oreonit.com/v1alpha1",
          "kind": "HarborWebhook",
          "metadata": {
            "name": "ci-notifications",
            "namespace": "team-payments"
          },
          "spec": {
            "connectionRef": {
              "name": "prod-harbor",
              "namespace": "harbor-system"
            },
            "description": "Tell CI about pushes and scan results",
            "eventTypes": [
              "PUSH_ARTIFACT",
              "SCANNING_COMPLETED",
              "SCANNING_FAILED"
            ],
            "name": "ci-notifications",
            "projectRef": {
              "name": "team-payments"
            },
            "targets": [
              {
                "address": "https://ci.example.com/hooks/harbor",
                "authHeaderSecretRef": {
                  "key": "authorization",
                  "name": "ci-webhook-auth"
                },
                "payloadFormat": "CloudEvents",
                "type": "http"
              }
            ]
          }
        }
      ]
    capabilities: Seamless Upgrades
    categories: Integration & Delivery, Developer Tools
    containerImage: ghcr.io/oreondev/harbor-resource-operator:0.1.0
